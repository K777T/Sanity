<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ViralDekho</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f23;
            color: white;
            overflow-x: hidden;
        }

        button,
        input {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
       HEADER
    ========================= */

        .header {
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            background: #1a1a2e;
            border-bottom: 1px solid #252545;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 21px;
            font-weight: bold;
            color: #00d4aa;
            white-space: nowrap;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-left: 30px;
        }

        .nav-tab {
            padding: 10px 14px;
            color: #aaa;
            border-radius: 7px;
            cursor: pointer;
        }

        .nav-tab:hover,
        .nav-tab.active {
            color: white;
            background: #252545;
        }

        .search-bar {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-input {
            width: 280px;
            padding: 11px 17px;
            border: 1px solid #29294b;
            outline: none;
            border-radius: 25px;
            background: #121228;
            color: white;
        }

        .search-input:focus {
            border-color: #00d4aa;
        }

        /* =========================
       LAYOUT
    ========================= */

        .main-container {
            display: flex;
            min-height: calc(100vh - 72px);
        }

        .sidebar {
            width: 230px;
            flex-shrink: 0;
            background: #1a1a2e;
            padding: 25px 15px;
            border-right: 1px solid #252545;
        }

        .sidebar-section {
            margin-bottom: 30px;
        }

        .sidebar-title {
            color: #777;
            font-size: 12px;
            text-transform: uppercase;
            margin: 0 10px 12px;
            letter-spacing: 1px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 13px;
            margin-bottom: 4px;
            color: #aaa;
            border-radius: 7px;
            cursor: pointer;
        }

        .sidebar-item:hover {
            background: #252545;
            color: white;
        }

        .sidebar-item.active {
            background: #00d4aa;
            color: #071b18;
        }

        .content {
            flex: 1;
            min-width: 0;
            padding: 25px;
        }

        /* =========================
       HERO
    ========================= */

        .hero-section {
            height: 390px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            margin-bottom: 35px;
            background: #17172b;
        }

        .hero-image {
            position: absolute;
            inset: 0;
            background-position: center;
            background-size: cover;
            filter: brightness(.55);
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    rgba(0, 0, 0, .9),
                    rgba(0, 0, 0, .45),
                    rgba(0, 0, 0, .15));
            display: flex;
            align-items: center;
            padding: 40px;
        }

        .hero-content {
            max-width: 600px;
        }

        .hero-title {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .hero-description {
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: 0;
            border-radius: 7px;
            padding: 12px 18px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background: #e74c3c;
            color: white;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, .12);
            color: white;
            border: 1px solid #555;
        }

        /* =========================
       VIDEO GRID
    ========================= */

        .section {
            margin-bottom: 40px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .section-title {
            font-size: 22px;
        }

        .video-count {
            color: #777;
            font-size: 13px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 18px;
        }

        .video-card {
            background: #191927;
            border: 1px solid #29293c;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: .2s;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #00d4aa;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
        }

        .thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #222;
            background-size: cover;
            background-position: center;
        }

        .thumbnail-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, .1);
            opacity: 0;
            transition: .2s;
        }

        .video-card:hover .thumbnail-overlay {
            opacity: 1;
            background: rgba(0, 0, 0, .35);
        }

        .play-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e74c3c;
        }

        .video-info {
            padding: 13px;
        }

        .video-title {
            font-weight: bold;
            font-size: 15px;
            line-height: 1.4;
            margin-bottom: 8px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
             line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            color: #777;
            font-size: 12px;
        }

        .rating {
            color: #f3b33d;
        }

        /* =========================
       RIGHT SIDEBAR
    ========================= */

        .sidebar-right {
            width: 280px;
            flex-shrink: 0;
            background: #171722;
            border-left: 1px solid #29293c;
            padding: 25px 15px;
        }

        .popular-item {
            display: flex;
            gap: 10px;
            padding: 9px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .popular-item:hover {
            background: #252535;
        }

        .popular-poster {
            width: 65px;
            height: 55px;
            flex-shrink: 0;
            border-radius: 6px;
            background-position: center;
            background-size: cover;
            background-color: #222;
        }

        .popular-info {
            min-width: 0;
        }

        .popular-info h4 {
            font-size: 13px;
            margin-bottom: 6px;
        }

        .popular-info p {
            font-size: 11px;
            color: #777;
        }

        /* =========================
       LOADING
    ========================= */

        .loading {
            padding: 50px;
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
        }

        .empty {
            padding: 50px;
            text-align: center;
            color: #777;
            grid-column: 1 / -1;
        }

        /* =========================
       MOBILE
    ========================= */

        @media (max-width: 1100px) {
            .sidebar-right {
                display: none;
            }

            .search-input {
                width: 200px;
            }
        }

        @media (max-width: 800px) {
            .sidebar {
                display: none;
            }

            .header {
                padding: 0 15px;
            }

            .nav-tabs {
                display: none;
            }

            .search-input {
                width: 150px;
            }

            .content {
                padding: 15px;
            }

            .hero-section {
                height: 330px;
            }

            .hero-overlay {
                padding: 25px;
            }

            .hero-title {
                font-size: 30px;
            }

            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        @media (max-width: 450px) {
            .search-bar i {
                display: none;
            }

            .search-input {
                width: 130px;
            }

            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            <i class="fas fa-play-circle"></i>
            ViralDekho
        </div>

        <nav class="nav-tabs">
            <a class="nav-tab active" href="#">
                Videos
            </a>

            <a class="nav-tab" href="#">
                Library
            </a>
        </nav>

        <div class="search-bar">

            <input id="searchInput" class="search-input" type="text" placeholder="Search videos..." />

            <i class="fas fa-search"></i>

        </div>

    </header>


    <div class="main-container">

        <!-- LEFT SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-section">

                <h3 class="sidebar-title">
                    Menu
                </h3>

                <a class="sidebar-item active" href="#">
                    <i class="fas fa-home"></i>
                    Home
                </a>

                <a class="sidebar-item" href="#trending">
                    <i class="fas fa-fire"></i>
                    Trending
                </a>

                <a class="sidebar-item" href="#latest">
                    <i class="fas fa-clock"></i>
                    Latest
                </a>

            </div>


            <div class="sidebar-section">

                <h3 class="sidebar-title">
                    Categories
                </h3>

                <div id="categoryMenu"></div>

            </div>


            <div class="sidebar-section">

                <h3 class="sidebar-title">
                    General
                </h3>

                <a class="sidebar-item" href="#">
                    <i class="fas fa-file-contract"></i>
                    Terms
                </a>

                <a class="sidebar-item" href="#">
                    <i class="fas fa-shield-alt"></i>
                    Privacy
                </a>

                <a class="sidebar-item" href="#">
                    <i class="fas fa-envelope"></i>
                    DMCA
                </a>

            </div>

        </aside>


        <!-- MAIN -->

        <main class="content">

            <!-- HERO -->

            <section class="hero-section">

                <div id="heroImage" class="hero-image"></div>

                <div class="hero-overlay">

                    <div class="hero-content">

                        <h1 id="heroTitle" class="hero-title">
                            Loading...
                        </h1>

                        <p id="heroDescription" class="hero-description">
                            Loading featured video...
                        </p>

                        <div class="hero-buttons">

                            <button id="heroPlay" class="btn btn-primary">
                                <i class="fas fa-play"></i>
                                Watch Now
                            </button>

                        </div>

                    </div>

                </div>

            </section>


            <!-- LATEST -->

            <section id="latest" class="section">

                <div class="section-header">

                    <h2 class="section-title">
                        Latest Videos
                    </h2>

                    <span id="videoCount" class="video-count">
                        0 videos
                    </span>

                </div>

                <div id="videoGrid" class="video-grid">

                    <div class="loading">
                        <i class="fas fa-spinner fa-spin"></i>
                        Loading videos...
                    </div>

                </div>

            </section>


            <!-- TRENDING -->

            <section id="trending" class="section">

                <div class="section-header">

                    <h2 class="section-title">
                        Trending
                    </h2>

                </div>

                <div id="trendingGrid" class="video-grid"></div>

            </section>

        </main>


        <!-- RIGHT SIDEBAR -->

        <aside class="sidebar-right">

            <div class="sidebar-section">

                <h3 class="sidebar-title">
                    Popular
                </h3>

                <div id="popularList"></div>

            </div>

        </aside>

    </div>


    <script>

        /* =========================================================
           SANITY CONFIG
        ========================================================= */

        const SANITY_PROJECT_ID = "YOUR_PROJECT_ID";
        const SANITY_DATASET = "production";
        const SANITY_API_VERSION = "2026-01-01";

        /*
          Sanity CDN endpoint.
        */

        const SANITY_URL =
            `https://${SANITY_PROJECT_ID}.apicdn.sanity.io/v${SANITY_API_VERSION}/data/query/${SANITY_DATASET}`;


        /* =========================================================
           OPTIONAL CLOUDFLARE THUMBNAIL CONFIG
        ========================================================= */

        /*
          Agar tum Cloudflare Images / Worker ke through thumbnails
          serve karna chahte ho to yahan apna image proxy/worker URL
          laga sakte ho.
        
          Example concept:
        
          https://img.example.com/
        
          Empty rakhoge to Sanity thumbnail URL use hoga.
        */

        const CLOUDFLARE_IMAGE_BASE = "";


        /* =========================================================
           SANITY IMAGE URL
        ========================================================= */

        function getSanityImageUrl(source) {

            if (!source) {
                return "";
            }

            /*
              Sanity image asset reference normally looks like:
          
              image-abc123-1920x1080-jpg
          
              This converts it into a Sanity CDN image URL.
            */

            const ref = source.asset?._ref;

            if (!ref) {
                return "";
            }

            const parts = ref.split("-");

            const format = parts.pop();
            const height = parts.pop();
            const width = parts.pop();

            const hash = parts.slice(1).join("-");

            let url =
                `https://cdn.sanity.io/images/` +
                `${SANITY_PROJECT_ID}/${SANITY_DATASET}/` +
                `${hash}-${width}x${height}.${format}`;

            /*
              Thumbnail optimization.
            */

            url += "?auto=format&fit=crop&w=900&q=80";

            return url;
        }


        /* =========================================================
           CLOUDFLARE THUMBNAIL
        ========================================================= */

        function getThumbnail(video) {

            const sanityImage =
                getSanityImageUrl(video.thumbnail);

            if (!sanityImage) {
                return "";
            }

            /*
              Agar Cloudflare configured hai:
          
              CLOUDFLARE_IMAGE_BASE = "https://img.example.com"
          
              to yahan tum apna Worker/proxy logic laga sakte ho.
          
              Otherwise direct Sanity CDN URL use hoga.
            */

            if (CLOUDFLARE_IMAGE_BASE) {
                return (
                    CLOUDFLARE_IMAGE_BASE +
                    "?url=" +
                    encodeURIComponent(sanityImage)
                );
            }

            return sanityImage;
        }


        /* =========================================================
           SANITY QUERY
        ========================================================= */

        const VIDEO_QUERY = `
  *[
    _type == "video"
  ]
  | order(_createdAt desc)
  {
    _id,
    title,
    "slug": slug.current,
    description,
    thumbnail,
    category,
    tags,
    rating,
    featured,
    server1Url,
    server2Url
  }
`;


        /* =========================================================
           FETCH SANITY
        ========================================================= */

        async function fetchVideos() {

            try {

                const response =
                    await fetch(
                        SANITY_URL +
                        "?query=" +
                        encodeURIComponent(VIDEO_QUERY)
                    );

                if (!response.ok) {
                    throw new Error("Sanity request failed");
                }

                const json =
                    await response.json();

                return json.result || [];

            } catch (error) {

                console.error(
                    "Sanity error:",
                    error
                );

                return [];

            }

        }


        /* =========================================================
           VIDEO URL
        ========================================================= */

        function getVideoPageUrl(video) {

            /*
              Recommended:
          
              /watch.html?slug=video-slug
          
              Agar tum Next.js/React use kar rahe ho to later:
          
              /watch/video-slug
          
              kar sakte ho.
            */

            return (
                "watch.html?slug=" +
                encodeURIComponent(video.slug)
            );

        }


        /* =========================================================
           VIDEO CARD
        ========================================================= */

        function createVideoCard(video) {

            const thumbnail =
                getThumbnail(video);

            const card =
                document.createElement("article");

            card.className =
                "video-card";

            card.dataset.title =
                (video.title || "").toLowerCase();

            card.innerHTML = `

    <div
      class="thumbnail"
      style="
        background-image:
        url('${thumbnail}');
      "
    >

      <div class="thumbnail-overlay">

        <div class="play-icon">
          <i class="fas fa-play"></i>
        </div>

      </div>

    </div>

    <div class="video-info">

      <div class="video-title">
        ${escapeHtml(video.title || "Untitled")}
      </div>

      <div class="video-meta">

        <span>
          ${escapeHtml(video.category || "Video")}
        </span>

        <span class="rating">
          <i class="fas fa-star"></i>
          ${video.rating || "N/A"}
        </span>

      </div>

    </div>

  `;


            card.addEventListener(
                "click",
                () => {

                    window.location.href =
                        getVideoPageUrl(video);

                }
            );


            return card;

        }


        /* =========================================================
           RENDER VIDEOS
        ========================================================= */

        function renderVideos(videos) {

            const grid =
                document.getElementById(
                    "videoGrid"
                );

            const trendingGrid =
                document.getElementById(
                    "trendingGrid"
                );


            grid.innerHTML = "";

            trendingGrid.innerHTML = "";


            if (!videos.length) {

                grid.innerHTML = `
      <div class="empty">
        No videos found.
      </div>
    `;

                return;

            }


            document.getElementById(
                "videoCount"
            ).textContent =
                `${videos.length} videos`;


            videos.forEach(
                video => {

                    grid.appendChild(
                        createVideoCard(video)
                    );

                }
            );


            /*
              First 8 videos as trending demo.
          
              Later Sanity mein "trending" field add
              karke proper filtering kar sakte ho.
            */

            videos
                .slice(0, 8)
                .forEach(
                    video => {

                        trendingGrid.appendChild(
                            createVideoCard(video)
                        );

                    }
                );

        }


        /* =========================================================
           FEATURED VIDEO
        ========================================================= */

        function renderHero(videos) {

            if (!videos.length) {
                return;
            }


            const featured =
                videos.find(
                    video => video.featured === true
                ) || videos[0];


            const thumbnail =
                getThumbnail(featured);


            document.getElementById(
                "heroImage"
            ).style.backgroundImage =
                `url("${thumbnail}")`;


            document.getElementById(
                "heroTitle"
            ).textContent =
                featured.title || "Featured Video";


            document.getElementById(
                "heroDescription"
            ).textContent =
                featured.description ||
                "Watch this featured video.";


            document.getElementById(
                "heroPlay"
            ).onclick = () => {

                window.location.href =
                    getVideoPageUrl(featured);

            };

        }


        /* =========================================================
           POPULAR
        ========================================================= */

        function renderPopular(videos) {

            const list =
                document.getElementById(
                    "popularList"
                );

            list.innerHTML = "";


            videos
                .slice(0, 6)
                .forEach(
                    video => {

                        const item =
                            document.createElement(
                                "div"
                            );

                        item.className =
                            "popular-item";


                        item.innerHTML = `

          <div
            class="popular-poster"
            style="
              background-image:
              url('${getThumbnail(video)}');
            "
          ></div>

          <div class="popular-info">

            <h4>
              ${escapeHtml(
                            video.title ||
                            "Untitled"
                        )}
            </h4>

            <p>
              ${escapeHtml(
                            video.category ||
                            "Video"
                        )}
            </p>

          </div>

        `;


                        item.onclick = () => {

                            window.location.href =
                                getVideoPageUrl(video);

                        };


                        list.appendChild(item);

                    }
                );

        }


        /* =========================================================
           CATEGORIES
        ========================================================= */

        function renderCategories(videos) {

            const container =
                document.getElementById(
                    "categoryMenu"
                );


            const categories =
                [
                    ...new Set(
                        videos
                            .map(
                                video => video.category
                            )
                            .filter(Boolean)
                    )
                ];


            container.innerHTML = "";


            categories
                .slice(0, 10)
                .forEach(
                    category => {

                        const item =
                            document.createElement(
                                "a"
                            );

                        item.className =
                            "sidebar-item";


                        item.href = "#";


                        item.innerHTML = `
          <i class="fas fa-film"></i>
          ${escapeHtml(category)}
        `;


                        item.onclick =
                            function (event) {

                                event.preventDefault();

                                filterCategory(
                                    videos,
                                    category
                                );

                            };


                        container.appendChild(item);

                    }
                );

        }


        /* =========================================================
           CATEGORY FILTER
        ========================================================= */

        function filterCategory(
            videos,
            category
        ) {

            const filtered =
                videos.filter(
                    video =>
                        video.category ===
                        category
                );


            renderVideos(filtered);

        }


        /* =========================================================
           SEARCH
        ========================================================= */

        function setupSearch(videos) {

            const input =
                document.getElementById(
                    "searchInput"
                );


            input.addEventListener(
                "input",
                function () {

                    const search =
                        this.value
                            .trim()
                            .toLowerCase();


                    if (!search) {

                        renderVideos(videos);

                        return;

                    }


                    const filtered =
                        videos.filter(
                            video => {

                                const title =
                                    (
                                        video.title || ""
                                    ).toLowerCase();


                                const category =
                                    (
                                        video.category || ""
                                    ).toLowerCase();


                                return (
                                    title.includes(search) ||
                                    category.includes(search)
                                );

                            }
                        );


                    renderVideos(filtered);

                }
            );

        }


        /* =========================================================
           HTML ESCAPE
        ========================================================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================================================
           INIT
        ========================================================= */

        async function init() {

            if (
                SANITY_PROJECT_ID ===
                "YOUR_PROJECT_ID"
            ) {

                console.warn(
                    "Add your Sanity Project ID first."
                );

                document.getElementById(
                    "videoGrid"
                ).innerHTML = `
      <div class="empty">
        Configure your Sanity Project ID first.
      </div>
    `;

                return;

            }


            const videos =
                await fetchVideos();


            renderVideos(videos);

            renderHero(videos);

            renderPopular(videos);

            renderCategories(videos);

            setupSearch(videos);

        }


        init();

    </script>

</body>

</html>
